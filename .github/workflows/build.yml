name: Build APK Native Mita Live

# Cukup upload MitaNative.zip (tanpa diekstrak) + file ini ke repo GitHub.
# Workflow akan mengekstrak ZIP di server GitHub lalu membangun APK-nya.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cari proyek (ekstrak ZIP otomatis bila perlu)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            PROJ="$GITHUB_WORKSPACE"
            echo "Proyek sudah terekstrak di root repo."
          else
            ZIP=""
            if [ -f MitaNative.zip ]; then ZIP="MitaNative.zip"
            else ZIP="$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' -printf '%s %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)"; fi
            if [ -z "$ZIP" ]; then echo "::error::Tidak ada settings.gradle maupun file .zip di repo. Upload MitaNative.zip ke root repo."; exit 1; fi
            echo "Mengekstrak: $ZIP"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
            S="$(find "$RUNNER_TEMP/src" \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*__MACOSX*' | awk '{ print length($0) " " $0 }' | sort -n | head -n1 | cut -d' ' -f2-)"
            if [ -z "$S" ]; then echo "::error::settings.gradle tidak ditemukan di dalam ZIP."; exit 1; fi
            PROJ="$(dirname "$S")"
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Folder proyek: $PROJ"
          ls "$PROJ"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Siapkan Android SDK (pakai SDK bawaan runner)
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Siapkan keystore (opsional, dari GitHub Secrets)
        shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi

      - name: Build APK rilis
        shell: bash
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd "$PROJ"
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/apk-out/MitaLive-native.apk"
          ls -la "$GITHUB_WORKSPACE/apk-out"

      - uses: actions/upload-artifact@v4
        with:
          name: MitaLive-native-apk
          path: apk-out/MitaLive-native.apk
          retention-days: 30
          if-no-files-found: error
