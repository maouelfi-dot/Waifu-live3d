# Simpan sebagai .github/workflows/build.yml
# Taruh file ZIP (berisi Mita_Live_v7.html atau index.html + aset) di root repo, lalu push / jalankan manual.
name: Build APK Mita Live
on:
  workflow_dispatch:
  push:
    paths: ['*.zip', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Ambil isi ZIP dan cari halaman utama
        run: |
          set -e
          mkdir -p work/www
          ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './work/*' | head -n1)
          if [ -n "$ZIP" ]; then unzip -q -o "$ZIP" -d work/unz; SRC=work/unz; else SRC=.; fi
          HTML=$(find "$SRC" -maxdepth 4 -iname index.html -not -path './work/*' -not -path '*/node_modules/*' | head -n1)
          if [ -z "$HTML" ]; then
            HTML=$(find "$SRC" -maxdepth 4 -iname '*.html' -not -path './work/*' -not -path '*/node_modules/*' -printf '%s %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)
          fi
          [ -n "$HTML" ] || { echo "Tidak ada file .html di ZIP/repo"; exit 1; }
          echo "Halaman utama: $HTML"
          cp -r "$(dirname "$HTML")"/. work/www/
          [ "$(basename "$HTML")" = "index.html" ] || cp "$HTML" work/www/index.html
          rm -rf work/www/.git work/www/work

      - name: Jadikan three.js dan JSZip resource APK (offline)
        run: |
          set -e
          npm install --prefix work/npm three@0.160.0 jszip@3.10.1 --silent
          V=work/www/vendor; mkdir -p $V/three/addons
          cp work/npm/node_modules/three/build/three.module.js $V/three/
          (cd work/npm/node_modules/three/examples/jsm && cp --parents libs/mmdparser.module.js loaders/MMDLoader.js loaders/TGALoader.js effects/OutlineEffect.js animation/MMDAnimationHelper.js animation/MMDPhysics.js animation/CCDIKSolver.js "$OLDPWD/$V/three/addons/")
          cp work/npm/node_modules/jszip/dist/jszip.min.js $V/
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js#./vendor/three/three.module.js#g; s#https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/#./vendor/three/addons/#g' work/www/index.html
          grep -c 'vendor/three' work/www/index.html

      - name: Buat proyek Android (WebView)
        run: |
          set -e
          A=work/android; mkdir -p $A/app/src/main/java/com/mita/live $A/app/src/main/assets
          cp -r work/www/. $A/app/src/main/assets/
          cat > $A/settings.gradle <<'X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'MitaLive'
          include ':app'
          X
          cat > $A/build.gradle <<'X'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          X
          echo "android.useAndroidX=true" > $A/gradle.properties
          cat > $A/app/build.gradle <<'X'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.mita.live'
            compileSdk 34
            defaultConfig { applicationId 'com.mita.live'; minSdk 21; targetSdk 34; versionCode 1; versionName '7.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            aaptOptions { noCompress 'gz','pmx','png','vmd','vpd' }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          X
          cat > $A/app/src/main/AndroidManifest.xml <<'X'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Mita Live" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout" android:windowSoftInputMode="adjustResize" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          X
          cat > $A/app/src/main/java/com/mita/live/MainActivity.java <<'X'
          package com.mita.live;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.*;
          import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends Activity {
            WebView w; ValueCallback<Uri[]> fcb;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              w = new WebView(this); setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false); s.setAllowFileAccess(false);
              final WebViewAssetLoader L = new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
              w.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) { return L.shouldInterceptRequest(r.getUrl()); }
              });
              w.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fcb != null) fcb.onReceiveValue(null);
                  fcb = cb;
                  try { startActivityForResult(p.createIntent(), 1); } catch (Exception e) { fcb = null; return false; }
                  return true;
                }
              });
              w.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }
            @Override protected void onActivityResult(int q, int r, Intent d) {
              if (q == 1 && fcb != null) { fcb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(r, d)); fcb = null; }
            }
            @Override public void onBackPressed() { if (w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          X

      - name: Build APK
        working-directory: work/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MitaLive-apk
          path: work/android/app/build/outputs/apk/debug/app-debug.apk
